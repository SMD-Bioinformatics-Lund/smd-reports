{% if section.rows %}<table class="results variant_table{% if section.key == 'snvs' and section.columns|length == 7 %} snv-summary{% endif %}"><thead><tr>{% for column in section.columns %}<th scope="col">{{ column.label }}</th>{% endfor %}</tr></thead><tbody>
{% for row in section.rows %}<tr>{% for column in section.columns %}<td{% if column.key == section.emphasis_column and row.get(column.key) == section.emphasis_value %} class="emphasis"{% endif %}>{{ row.get(column.key)|display }}</td>{% endfor %}</tr>{% endfor %}
</tbody></table>{% else %}<p class="empty">{{ section.empty_text|ui }}</p>{% endif %}
