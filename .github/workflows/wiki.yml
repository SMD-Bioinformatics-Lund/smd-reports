name: Publish wiki
on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/build_wiki.py'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-wiki
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[docs]'
      - run: python -m mkdocs build --strict
      - name: Prepare wiki pages
        run: python scripts/build_wiki.py --output .artifacts/wiki --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA"
      - name: Update wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            clone --depth=1 "https://github.com/${GITHUB_REPOSITORY}.wiki.git" .artifacts/wiki-checkout
          rsync -a --delete --exclude='.git' .artifacts/wiki/ .artifacts/wiki-checkout/
          cd .artifacts/wiki-checkout
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'Wiki is already up to date.'
            exit 0
          fi
          git commit -m "Update documentation from ${GITHUB_SHA}"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD
