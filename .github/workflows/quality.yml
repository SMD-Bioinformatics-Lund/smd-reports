name: Quality
on:
  pull_request:
    branches: [dev, master]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'pre-commit>=4.6.2,<5'
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py312-${{ hashFiles('.pre-commit-config.yaml', 'pyproject.toml') }}
      - run: python -m pre_commit run --all-files
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install '.[docs]'
      - run: python -m mkdocs build --strict
      - name: Check wiki pages and links
        run: python scripts/build_wiki.py --output .artifacts/wiki --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: documentation
          path: site/
          retention-days: 7
  core:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest -n 2 -q --durations=10 --ignore=tests/test_pdf.py
      - run: python -m build
        if: matrix.python == '3.12'
      - run: python -m twine check --strict dist/*
        if: matrix.python == '3.12'
      - run: python scripts/check_installation.py
        if: matrix.python == '3.12'
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.python == '3.12'
        with:
          name: distributions-${{ matrix.python }}
          path: dist/*
          retention-days: 7
  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: python -m pip install '.[pdf,test]'
      - run: python -m pytest -n 2 -q --durations=10 --cov=smd_reports --cov-branch --cov-report=term-missing --cov-report=xml --cov-report=html
      - run: python examples/reports.py --pdf
      - run: smd-reports render examples/inputs/genexus-en.json --format html --output .artifacts/examples/genexus-en.html
      - run: weasyprint .artifacts/examples/genexus-en.html .artifacts/examples/genexus-en.pdf
      - run: python scripts/visual_review.py .artifacts/examples
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: example-reports
          path: .artifacts/
          retention-days: 7
