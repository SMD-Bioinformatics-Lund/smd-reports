name: PR target
on:
  pull_request:
    branches: [dev, master]
permissions:
  contents: read
jobs:
  branch-flow:
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BASE_BRANCH: ${{ github.base_ref }}
      HEAD_BRANCH: ${{ github.head_ref }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      BASE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check development and release targets
        shell: python
        run: |
          import os
          base = os.environ['BASE_BRANCH']
          head = os.environ['HEAD_BRANCH']
          same_repository = os.environ['HEAD_REPOSITORY'] == os.environ['BASE_REPOSITORY']
          if base == 'master' and (head != 'dev' or not same_repository):
              raise SystemExit('Release PRs to master must come from this repository\'s dev branch.')
          if base == 'dev' and head == 'master' and same_repository:
              raise SystemExit('Development changes must target dev from a work branch.')
          print(f'Accepted PR flow: {head} -> {base}')
      - uses: actions/checkout@v4
        if: github.base_ref == 'master'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: github.base_ref == 'master'
        with:
          python-version: '3.12'
      - name: Install release-check dependency
        if: github.base_ref == 'master'
        run: python -m pip install 'packaging>=24,<27'
      - name: Check release version and changelog
        if: github.base_ref == 'master'
        run: python scripts/check_release.py --base-ref "$BASE_SHA"
