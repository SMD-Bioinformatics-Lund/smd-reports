name: Bug report
description: Report incorrect behavior or a regression.
labels:
- bug
- 'status: triage'
body:
- type: markdown
  attributes:
    value: Use example data only. Do not include patient information, credentials or confidential files.
      Report security vulnerabilities through the private security-reporting link.
- type: dropdown
  id: priority
  attributes:
    label: Priority
    description: Select the impact. Maintainers may adjust the priority.
    options:
    - P0 - Critical
    - P1 - High
    - P2 - Normal
    - P3 - Low
    default: 2
  validations:
    required: true
- type: dropdown
  id: component
  attributes:
    label: Component
    options:
    - JSON input and validation
    - Python interface
    - Command-line tools
    - HTML rendering
    - PDF rendering
    - Page layout and branding
    - Images and plots
    - English and Swedish labels
    - Packaging and installation
    - CI and development tools
    - Documentation
    - Not sure
    multiple: true
  validations:
    required: true
- type: dropdown
  id: report-template
  attributes:
    label: Report template
    options:
    - Generic
    - Coyote3
    - Genexus
    - CLL Genie
    - PGx
    - Not template-specific
    multiple: true
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: What happened?
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: Steps to reproduce
    description: Include a minimal JSON example or command using example data.
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected behavior
  validations:
    required: true
- type: input
  id: package-version
  attributes:
    label: Package version
    description: 'Run: python -c "import smd_reports; print(smd_reports.__version__)"'
  validations:
    required: true
- type: input
  id: python-version
  attributes:
    label: Python version
    description: 'Run: python --version'
  validations:
    required: true
- type: dropdown
  id: os
  attributes:
    label: Operating system
    options:
    - Linux
    - Windows
    - macOS
    - Other
  validations:
    required: true
- type: textarea
  id: logs
  attributes:
    label: Error output
    description: Include relevant output after removing confidential information.
    render: text
  validations:
    required: false
- type: checkboxes
  id: checks
  attributes:
    label: Before submitting
    options:
    - label: I searched the existing issues.
      required: true
    - label: My examples contain no patient information, credentials or confidential data.
      required: true
  validations:
    required: true
