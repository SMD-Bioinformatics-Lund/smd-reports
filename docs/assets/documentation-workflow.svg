<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="574" viewBox="0 0 1120 574" role="img" aria-labelledby="title description">
<title id="title">Documentation publishing</title>
<desc id="description">Documentation source is built by MkDocs using Python 3.12, the docs extra and the Read the Docs theme. Hosting on Read the Docs still requires repository import and version activation. The GitHub wiki is synchronized from docs after changes merge into master.</desc>
