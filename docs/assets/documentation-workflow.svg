<text x="56" y="253" fill="#526579" font-size="14" font-weight="400">mkdocs.yml</text>
<text x="56" y="278" fill="#526579" font-size="14" font-weight="400">Read the Docs configuration</text>
<rect x="410" y="143" width="300" height="168" rx="16" fill="#e9eef2" opacity=".65"/>
<rect x="410" y="140" width="300" height="168" rx="16" fill="#fff" stroke="#cbd5df"/>
