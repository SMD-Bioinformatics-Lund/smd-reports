<text x="36" y="478" fill="#526579" font-size="13" font-weight="400">Wiki pages sync after</text>
<text x="36" y="499" fill="#526579" font-size="13" font-weight="400">merges into master.</text>
<text x="36" y="545" fill="#526579" font-size="14" font-weight="400">Read the Docs rebuilds enabled versions after repository import. The wiki is available independently.</text>
