<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="588" viewBox="0 0 1120 588" role="img" aria-labelledby="title description">
<title id="title">Report generation</title>
<desc id="description">JSON files or text are validated by ReportLoader, which embeds local images. ReportRenderer applies templates, themes and language labels to produce standalone HTML. The HTML can be viewed or printed, or converted to PDF with optional WeasyPrint support.</desc>
