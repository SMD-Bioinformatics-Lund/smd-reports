<footer>
  {% if page and (page.next_page or page.previous_page) %}
  <nav class="rst-footer-buttons" aria-label="Page navigation">
    {% if page.previous_page %}<a href="{{ page.previous_page.url|url }}" class="btn btn-neutral float-left" rel="prev">Previous</a>{% endif %}
    {% if page.next_page %}<a href="{{ page.next_page.url|url }}" class="btn btn-neutral float-right" rel="next">Next</a>{% endif %}
  </nav>
  {% endif %}
  <hr>
  <div role="contentinfo"><p>{{ config.copyright }}</p></div>
</footer>
