minimum_pre_commit_version: '4.6.2'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: check-yaml
        # MkDocs validates !ENV tags; this hook checks YAML syntax.
        name: Check MkDocs YAML
        files: ^mkdocs\.yml$
        args: [--unsafe]
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
