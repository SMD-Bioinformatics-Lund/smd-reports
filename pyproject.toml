[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48"]
build-backend = "setuptools.build_meta"

[project]
name = "smd-reports"
dynamic = ["version"]
description = "JSON-based reports with dynamic tables, localized themes and portable HTML/PDF"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Ram Nanduri", email = "Ram.Nanduri@skane.se"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Markup :: HTML",
]
license = "GPL-3.0-only"
license-files = ["LICENSE", "COPYRIGHT"]
dependencies = [
  "pydantic>=2.14.3,<3",
  "Jinja2>=3.1.6,<4",
  "Markdown>=3.10.3,<4",
  "bleach>=6.4,<7",
  "defusedxml>=0.7.1,<1",
  "Pillow>=12.3,<14",
  "tinycss2>=1.5.1,<2",
  "fonttools>=4.65,<5",
  "Brotli>=1.2.1,<2",
]

[project.urls]
Homepage = "https://github.com/SMD-Bioinformatics-Lund/smd-reports"
Documentation = "https://smd-reports.readthedocs.io/en/latest/"
Repository = "https://github.com/SMD-Bioinformatics-Lund/smd-reports"
Issues = "https://github.com/SMD-Bioinformatics-Lund/smd-reports/issues"
Changelog = "https://github.com/SMD-Bioinformatics-Lund/smd-reports/blob/master/CHANGELOG.md"

[project.optional-dependencies]
docs = ["mkdocs>=1.6.1,<2", "pyyaml-env-tag>=1.1,<2"]
pdf = ["weasyprint==70.0"]
dev = ["pre-commit>=4.6.2,<5"]
test = [
  "packaging>=26.3,<27",
  "pytest>=9.2,<10",
  "pytest-cov>=7.1,<8",
  "pytest-xdist>=3.8,<4",
  "PyYAML>=6.0.3,<7",
  "pyyaml-env-tag>=1.1,<2",
  "PyMuPDF>=1.28.2,<3",
  "build>=1.6.1,<2",
  "ruff==0.17.4",
  "twine>=7,<8",
]

[project.scripts]
smd-reports = "smd_reports.cli:main"

[tool.setuptools.dynamic]
version = {attr = "smd_reports.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.__pycache__*"]

[tool.setuptools.package-data]
smd_reports = ["py.typed", "templates/**/*.html", "static/*.css", "static/*.md", "themes/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.coverage.run]
source = ["smd_reports"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true
precision = 2

[tool.coverage.html]
directory = ".artifacts/coverage/html"

[tool.coverage.xml]
output = ".artifacts/coverage/coverage.xml"
